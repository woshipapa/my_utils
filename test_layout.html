
        <!DOCTYPE html>
        <html lang="zh-CN">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Performance Analysis Report</title>
            <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
            <style>
            
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #2c3e50;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .report-header {
            background: white;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .report-header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        /* Summary Card */
        .summary-card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .score-good { border-left: 6px solid #10b981; }
        .score-warning { border-left: 6px solid #f59e0b; }
        .score-critical { border-left: 6px solid #ef4444; }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }

        .summary-content {
            flex: 1;
        }

        .summary-content h3 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: #2c3e50;
        }

        .summary-text {
            font-size: 1.1rem;
            color: #7f8c8d;
            margin-bottom: 16px;
        }

        .summary-details {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .summary-detail {
            display: flex;
            gap: 8px;
        }

        .detail-label {
            font-weight: 600;
            color: #2c3e50;
        }

        .detail-value {
            color: #7f8c8d;
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .metric-label {
            color: #7f8c8d;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Chart */
        .chart-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .chart-section h3 {
            margin-bottom: 16px;
            color: #2c3e50;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
        }

        /* Two Column Layout */
        .two-column-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 24px;
        }

        .two-column-layout .column {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .two-column-layout h3 {
            margin-bottom: 16px;
            color: #2c3e50;
        }

        /* Findings */
        .findings-section, .recommendations-section {
            background: white;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .findings-section h2, .recommendations-section h2 {
            margin-bottom: 24px;
            color: #2c3e50;
        }

        .finding-item, .recommendation-item {
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border-left: 4px solid #cbd5e1;
            background: #f8fafc;
        }

        .severity-critical { border-left-color: #ef4444; background: #fef2f2; }
        .severity-high { border-left-color: #f97316; background: #fff7ed; }
        .severity-medium { border-left-color: #f59e0b; background: #fffbeb; }
        .severity-low { border-left-color: #3b82f6; background: #eff6ff; }

        .finding-header, .rec-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .finding-title, .rec-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #2c3e50;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-critical { background: #ef4444; color: white; }
        .badge-high { background: #f97316; color: white; }
        .badge-medium { background: #f59e0b; color: white; }
        .badge-low { background: #3b82f6; color: white; }

        .finding-description, .rec-description {
            color: #7f8c8d;
            margin-bottom: 12px;
        }

        .finding-meta, .rec-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .finding-meta span, .rec-meta span {
            font-size: 0.9rem;
            color: #7f8c8d;
        }

        .finding-evidence {
            margin-top: 12px;
            padding: 12px;
            background: white;
            border-radius: 8px;
        }

        .evidence-item {
            display: flex;
            gap: 8px;
            margin-bottom: 4px;
        }

        .evidence-key {
            font-weight: 600;
            color: #2c3e50;
        }

        .evidence-value {
            color: #7f8c8d;
        }

        /* Recommendations */
        .priority-high { border-left-color: #ef4444; }
        .priority-medium { border-left-color: #f59e0b; }
        .priority-low { border-left-color: #3b82f6; }

        .rec-priority {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            background: #e2e8f0;
        }

        .rec-actions {
            margin-top: 12px;
        }

        .rec-actions ul {
            margin-left: 20px;
            color: #7f8c8d;
        }

        .rec-actions li {
            margin-bottom: 4px;
        }

        /* Table */
        .table-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        .table-section h3 {
            margin-bottom: 16px;
            color: #2c3e50;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th, .data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .data-table th {
            font-weight: 600;
            background: #f8fafc;
            color: #2c3e50;
        }

        .data-table tr:hover {
            background: #f8fafc;
        }

        /* Code Block */
        .code-block {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            overflow-x: auto;
        }

        .code-block pre {
            margin: 0;
        }

        .code-block code {
            color: #e2e8f0;
            font-family: "Monaco", "Consolas", monospace;
            font-size: 0.9rem;
        }

        /* Divider */
        .section-divider {
            border: none;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
            margin: 32px 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .two-column-layout {
                grid-template-columns: 1fr;
            }

            .summary-card {
                flex-direction: column;
                text-align: center;
            }

            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
            </style>
        </head>
        <body>
            <div class="container">
                
            <div class="report-header">
                <h1>Test Report</h1>
                <p class="subtitle">Generated by test script</p>
            </div>
            
            <div class="summary-card score-good">
                <div class="score-circle" style="background: #10b981;">
                    85
                </div>
                <div class="summary-content">
                    <h3>Performance Score</h3>
                    <p class="summary-text">Test summary text</p>
                    <div class="summary-details"><div class="summary-detail"><span class="detail-label">Test1:</span> <span class="detail-value">Value1</span></div><div class="summary-detail"><span class="detail-label">Test2:</span> <span class="detail-value">Value2</span></div></div>
                </div>
            </div>
            
            </div>
            <script>
            // No additional scripts
            </script>
        </body>
        </html>
